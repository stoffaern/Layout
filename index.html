<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gecko Reel Collage</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100vh;height:100dvh;display:grid;grid-template-rows:34px minmax(0,1fr) 118px}
header{display:flex;align-items:center;padding:0 9px;border-bottom:1px solid #2b2b2b;font-size:13px;font-weight:750}
main{min-height:0;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden}
canvas{display:block;max-height:100%;max-width:100%;width:auto;height:auto;aspect-ratio:9/16;background:#292929;touch-action:none;box-shadow:0 4px 18px #0008}
.toolbar{background:#191919;border-top:1px solid #333;padding:5px 7px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:31px 31px 31px;gap:4px}
button,.upload{border:0;border-radius:7px;background:#333;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center}
.upload{background:#fff;color:#111}.upload input{display:none}.control{min-width:0;padding:0 2px}
.control label{display:flex;justify-content:space-between;font-size:8px;color:#bbb;line-height:10px}input[type=range]{width:100%;height:16px;margin:0}
.zoom{grid-column:1/3;grid-row:2}.lines{grid-column:3;grid-row:2}
.upload{grid-column:1;grid-row:1}.replace{grid-column:2;grid-row:1}.reset{grid-column:3;grid-row:1}
.undo{grid-column:1;grid-row:3}.redo{grid-column:2;grid-row:3}.export{grid-column:3;grid-row:3;background:#fff;color:#111}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:39px;background:#000b;padding:5px 8px;border-radius:7px;font-size:9px;z-index:5;pointer-events:none;opacity:0;transition:.2s}.hint.show{opacity:1}
@media(min-width:700px){body{grid-template-rows:42px minmax(0,1fr) 92px}.toolbar{grid-template-columns:160px 130px 130px 1fr 1fr 90px 90px 180px;grid-template-rows:1fr;align-items:center;padding:8px 12px}.upload,.replace,.reset,.zoom,.lines,.undo,.redo,.export{grid-row:1}.upload{grid-column:1}.replace{grid-column:2}.reset{grid-column:3}.zoom{grid-column:4}.lines{grid-column:5}.undo{grid-column:6}.redo{grid-column:7}.export{grid-column:8}}
</style></head><body>
<header>Gecko Reel Collage</header>
<main><canvas id="cv" width="1080" height="1920"></canvas></main>
<div class="hint" id="hint"></div>
<section class="toolbar">
<label class="upload">UPLOAD 4<input id="pickAll" type="file" accept="image/*" multiple></label>
<button class="replace" id="replace">REPLACE PHOTO</button><button class="reset" id="reset">RESET CROP</button>
<div class="control zoom"><label><span>Selected zoom</span><span id="zv">100%</span></label><input id="zoom" type="range" min="100" max="300" value="100"></div>
<div class="control lines"><label><span>Lines</span><span id="gv">4 px</span></label><input id="gap" type="range" min="0" max="20" value="4"></div>
<button class="undo" id="undo">UNDO</button><button class="redo" id="redo">REDO</button><button class="export" id="save">SAVE / SHARE</button>
<input id="pickOne" type="file" accept="image/*" hidden>
</section>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),pickAll=document.getElementById('pickAll'),pickOne=document.getElementById('pickOne'),zoom=document.getElementById('zoom'),gap=document.getElementById('gap'),hint=document.getElementById('hint');
const blank=()=>({im:null,name:'',zoom:1,x:0,y:0,src:''});
let imgs=[blank(),blank(),blank(),blank()],sel=0,pointers=new Map(),gesture=null,longTimer=null,longMode=false,startSlot=0,lastTap=0,history=[],future=[],pendingSlot=null;
const d=()=>({g:+gap.value,h:(1920-(+gap.value)*3)/4});
function snap(){return imgs.map(o=>({src:o.src,name:o.name,zoom:o.zoom,x:o.x,y:o.y}))}
function pushHistory(){history.push(snap());if(history.length>30)history.shift();future=[]}
async function restore(s){imgs=await Promise.all(s.map(async o=>{if(!o.src)return blank();let im=await load(o.src);return{...o,im}}));sync();draw()}
function load(src){return new Promise(res=>{let im=new Image();im.onload=()=>res(im);im.src=src})}
function flash(t){hint.textContent=t;hint.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>hint.classList.remove('show'),1100)}
function clamp(o,w,hh){let q=d(),mx=Math.max(0,(w-1080)/2),my=Math.max(0,(hh-q.h)/2);o.x=Math.max(-mx,Math.min(mx,o.x));o.y=Math.max(-my,Math.min(my,o.y))}
function draw(select=true,dragY=null){
 ctx.fillStyle='#292929';ctx.fillRect(0,0,1080,1920);let q=d();
 imgs.forEach((o,i)=>{let y=i*(q.h+q.g);ctx.save();ctx.beginPath();ctx.rect(0,y,1080,q.h);ctx.clip();
 if(o.im){let base=Math.max(1080/o.im.naturalWidth,q.h/o.im.naturalHeight),s=base*o.zoom,w=o.im.naturalWidth*s,hh=o.im.naturalHeight*s;clamp(o,w,hh);ctx.drawImage(o.im,(1080-w)/2+o.x,y+(q.h-hh)/2+o.y,w,hh)}
 else{ctx.fillStyle='#242424';ctx.fillRect(0,y,1080,q.h);ctx.fillStyle='#666';ctx.textAlign='center';ctx.font='bold 54px -apple-system,sans-serif';ctx.fillText('+',540,y+q.h/2-18);ctx.font='30px -apple-system,sans-serif';ctx.fillText('Tap to add photo',540,y+q.h/2+30)}
 ctx.restore();if(i<3){ctx.fillStyle='#fff';ctx.fillRect(0,y+q.h,1080,q.g)}});
 if(select){ctx.strokeStyle='#4da3ff';ctx.lineWidth=5;ctx.strokeRect(2.5,sel*(q.h+q.g)+2.5,1075,q.h-5)}
}
function sync(){zoom.value=Math.round(imgs[sel].zoom*100);document.getElementById('zv').textContent=zoom.value+'%'}
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*1080/r.width,y:(e.clientY-r.top)*1920/r.height}}
function slot(y){let q=d();return Math.max(0,Math.min(3,Math.floor(y/(q.h+q.g))))}
function choose(i){sel=i;sync();draw()}
function openOne(i){pendingSlot=i;pickOne.value='';pickOne.click()}
async function fileToObj(f){return await new Promise(res=>{let r=new FileReader();r.onload=async e=>{let im=await load(e.target.result);res({im,src:e.target.result,name:f.name,zoom:1,x:0,y:0})};r.readAsDataURL(f)})}
pickAll.onchange=async()=>{let fs=[...pickAll.files].slice(0,4);if(!fs.length)return;pushHistory();for(let i=0;i<fs.length;i++)imgs[i]=await fileToObj(fs[i]);sel=0;sync();draw();pickAll.value=''};
pickOne.onchange=async()=>{let f=pickOne.files[0];if(!f||pendingSlot==null)return;pushHistory();imgs[pendingSlot]=await fileToObj(f);sel=pendingSlot;pendingSlot=null;sync();draw()};
document.getElementById('replace').onclick=()=>openOne(sel);
document.getElementById('reset').onclick=()=>{if(!imgs[sel].im)return;pushHistory();imgs[sel].zoom=1;imgs[sel].x=imgs[sel].y=0;sync();draw()};
zoom.onpointerdown=()=>pushHistory();zoom.oninput=()=>{imgs[sel].zoom=+zoom.value/100;document.getElementById('zv').textContent=zoom.value+'%';draw()};
gap.onpointerdown=()=>pushHistory();gap.oninput=()=>{document.getElementById('gv').textContent=gap.value+' px';draw()};
document.getElementById('undo').onclick=async()=>{if(!history.length)return;future.push(snap());await restore(history.pop())};
document.getElementById('redo').onclick=async()=>{if(!future.length)return;history.push(snap());await restore(future.pop())};

cv.onpointerdown=e=>{
 e.preventDefault();cv.setPointerCapture?.(e.pointerId);let p=pos(e),i=slot(p.y);choose(i);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){gesture={type:'drag',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false};startSlot=i;longMode=false;clearTimeout(longTimer);longTimer=setTimeout(()=>{if(gesture&&!gesture.moved&&imgs[sel].im){pushHistory();longMode=true;gesture.type='reorder';flash('Drag to rearrange')}} ,500)}
 else if(pointers.size===2){clearTimeout(longTimer);let ps=[...pointers.values()],dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);pushHistory();gesture={type:'pinch',dist,z:imgs[sel].zoom}}
};
cv.onpointermove=e=>{
 if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(!gesture)return;
 if(gesture.type==='pinch'&&pointers.size>=2){let ps=[...pointers.values()],dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);imgs[sel].zoom=Math.max(1,Math.min(3,gesture.z*dist/gesture.dist));sync();draw();return}
 let dx=e.clientX-gesture.lx,dy=e.clientY-gesture.ly;if(Math.hypot(e.clientX-gesture.sx,e.clientY-gesture.sy)>7)gesture.moved=true;
 if(gesture.moved&&!longMode)clearTimeout(longTimer);
 if(gesture.type==='reorder'){let target=slot(pos(e).y);if(target!==sel){let moving=imgs.splice(sel,1)[0];imgs.splice(target,0,moving);sel=target;draw();navigator.vibrate?.(20)}}
 else if(gesture.type==='drag'&&imgs[sel].im){let r=cv.getBoundingClientRect();imgs[sel].x+=dx*1080/r.width;imgs[sel].y+=dy*1920/r.height;draw()}
 gesture.lx=e.clientX;gesture.ly=e.clientY;
};
function endPointer(e){
 let wasSingle=pointers.size===1,moved=gesture?.moved,type=gesture?.type;clearTimeout(longTimer);pointers.delete(e.pointerId);
 if(!pointers.size){if(wasSingle&&!moved&&type==='drag'){let now=Date.now();if(now-lastTap<330&&imgs[sel].im){pushHistory();imgs[sel].zoom=1;imgs[sel].x=imgs[sel].y=0;sync();draw();flash('Crop reset');lastTap=0}else{if(!imgs[sel].im)openOne(sel);lastTap=now}}gesture=null;longMode=false}
}
cv.onpointerup=endPointer;cv.onpointercancel=endPointer;
document.getElementById('save').onclick=()=>{
 if(imgs.some(o=>!o.im)){alert('Please add a photo to all four boxes first.');return}
 draw(false);cv.toBlob(async blob=>{try{let file=new File([blob],'gecko-reel-collage.jpg',{type:'image/jpeg'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))await navigator.share({files:[file],title:'Gecko Reel Collage'});else{let u=URL.createObjectURL(blob);window.location.href=u;setTimeout(()=>URL.revokeObjectURL(u),60000)}}catch(e){if(e.name!=='AbortError'){let u=URL.createObjectURL(blob);window.location.href=u}}finally{setTimeout(()=>draw(true),100)}},'image/jpeg',.98)
};
sync();draw();
</script></body></html>
